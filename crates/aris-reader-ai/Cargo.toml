[package]
name = "aris-reader-ai"
description = "AI layer: LLM provider abstraction, context building, citation/figure index (independent of any concrete model)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
aris-reader-core = { workspace = true }
serde_json = "1"

# The AI layer runs on plain OS threads and blocking sockets: one worker per request, with a
# cancellation flag polled between reads. That keeps the crate independent of an async runtime
# and makes cancellation exercisable on every platform.

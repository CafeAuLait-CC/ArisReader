[package]
name = "aris-reader-ffi"
description = "Public FFI: UniFFI control plane + hand-written C ABI (GPU device/surface handoff)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "aris_reader_ffi"
# staticlib → SwiftPM static linking; cdylib → future C#/Kotlin shells; rlib → Rust-internal tests
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
aris-reader-core = { workspace = true }
aris-reader-session = { workspace = true }
aris-reader-gpu = { workspace = true }

